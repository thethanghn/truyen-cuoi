<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Truyện Cười</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <nav class="navbar navbar-default">
    <div class="container">
      <div class="brand-wrap pull-left">
        <a class="topimg" href="./"><img src="assets/images/topimg.jpg" alt=""></a>
        <a id="logo" href="./">Nguyen The Thang</a>
      </div>
      <nav class="view-links">
        <a data-view="unread" href="./" title="Stories you haven't read yet">Stories</a>
        <a data-view="read" href="./?read=1" title="Stories you've hidden">Read <span class="read-count"></span></a>
        <a href="random.html" title="Show one random story">Random</a>
      </nav>
    </div>

  <div class="container main">
    <p class="hint text-muted" id="hint"></p>
    <div id="masonry-container" class="clearfix"></div>
    <div class="infinite-status text-center text-muted">Loading stories…</div>
  </div>

  <div class="container">
    <footer class="row">
      <div class="col-md-4">No Right Reserved</div>
      <div class="col-md-4">Just For Fun</div>
      <div class="col-md-4">Testing</div>
    </footer>
  </div>

  <script src="assets/vendor/masonry.pkgd.min.js"></script>
  <script src="assets/vendor/imagesloaded.pkgd.min.js"></script>
  <script src="assets/stories.js"></script>
  <script src="assets/app.js"></script>

</html>
